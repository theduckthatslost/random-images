<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 230" width="280" height="230">
  <defs>
    <style>
      .stroke-white-thick { stroke: #ffffff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-white-thin { stroke: #ffffff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .sparkle-white { fill: #ffffff; }
    </style>
  </defs>

  <!-- Steam lines rising from hotdog -->
  <path d="M 120 40 Q 115 30 120 20 Q 125 10 120 0" fill="none" class="stroke-white-thin" />
  <path d="M 140 38 Q 135 28 140 18 Q 145 8 140 -2" fill="none" class="stroke-white-thin" />
  <path d="M 160 40 Q 155 30 160 20 Q 165 10 160 0" fill="none" class="stroke-white-thin" />

  <!-- Sparkles around hotdog -->
  <!-- Left sparkle -->
  <path class="sparkle-white" d="M 50 60 Q 50 70 40 70 Q 50 70 50 80 Q 50 70 60 70 Q 50 70 50 60 Z" />
  <line x1="43" y1="63" x2="57" y2="77" stroke="#ffffff" stroke-width="1.2" />
  <line x1="57" y1="63" x2="43" y2="77" stroke="#ffffff" stroke-width="1.2" />

  <!-- Right sparkle -->
  <path class="sparkle-white" d="M 230 65 Q 230 75 220 75 Q 230 75 230 85 Q 230 75 240 75 Q 230 75 230 65 Z" />
  <line x1="223" y1="68" x2="237" y2="82" stroke="#ffffff" stroke-width="1.2" />
  <line x1="237" y1="68" x2="223" y2="82" stroke="#ffffff" stroke-width="1.2" />

  <!-- Left running leg -->
  <path d="M 115 155 Q 100 175 90 195" fill="none" class="stroke-white-thick" />
  <path d="M 78 198 C 78 192 94 188 102 196 C 106 200 100 208 86 208 C 76 208 78 200 78 198 Z" fill="#0a3382" class="stroke-white-thin" />
  <line x1="82" y1="204" x2="98" y2="204" class="stroke-white-thin" />

  <!-- Right running leg -->
  <path d="M 165 155 Q 175 175 190 195" fill="none" class="stroke-white-thick" />
  <path d="M 180 198 C 180 190 198 190 208 196 C 214 200 208 206 190 206 C 182 206 180 200 180 198 Z" fill="#0a3382" class="stroke-white-thin" />
  <line x1="184" y1="202" x2="204" y2="202" class="stroke-white-thin" />

  <!-- Left Arm (extended outward happily) -->
  <path d="M 75 110 Q 50 115 45 130" fill="none" class="stroke-white-thick" />
  <circle cx="45" cy="133" r="6" fill="#0a3382" class="stroke-white-thin" />
  <path d="M 40 132 Q 35 140 44 142" fill="#0a3382" class="stroke-white-thin" />

  <!-- Right Arm (extended outward happily) -->
  <path d="M 205 110 Q 230 115 235 130" fill="none" class="stroke-white-thick" />
  <circle cx="235" cy="133" r="6" fill="#0a3382" class="stroke-white-thin" />
  <path d="M 235 130 Q 244 136 238 142" fill="#0a3382" class="stroke-white-thin" />

  <!-- Hot Dog Bun (Bottom / Back) -->
  <path d="M 60 120 C 50 100 70 80 100 80 L 180 80 C 210 80 230 100 220 120 C 210 150 190 155 140 155 C 90 155 70 150 60 120 Z" fill="#0a3382" class="stroke-white-thick" />

  <!-- Sausage / Frankfurters Body with smiling face -->
  <path d="M 65 105 C 55 90 80 70 110 70 L 170 70 C 200 70 225 90 215 105 C 205 125 185 130 140 130 C 95 130 75 125 65 105 Z" fill="#0a3382" class="stroke-white-thick" />

  <!-- Mustard Squiggle on top -->
  <path d="M 85 75 Q 95 68 105 75 Q 115 82 125 75 Q 135 68 145 75 Q 155 82 165 75 Q 175 68 185 75 Q 195 82 200 75" fill="none" class="stroke-white-thin" />

  <!-- Cartoon Face on Sausage -->
  <!-- Left Eye -->
  <ellipse cx="125" cy="100" rx="5" ry="8" fill="#ffffff" />
  <circle cx="126" cy="98" r="2" fill="#0a3382" />
  <path d="M 120 90 Q 125 87 130 89" fill="none" class="stroke-white-thin" />

  <!-- Right Eye -->
  <ellipse cx="155" cy="100" rx="5" ry="8" fill="#ffffff" />
  <circle cx="156" cy="98" r="2" fill="#0a3382" />
  <path d="M 150 89 Q 155 87 160 90" fill="none" class="stroke-white-thin" />

  <!-- Happy Smile -->
  <path d="M 124 112 Q 140 128 156 112" fill="none" class="stroke-white-thick" />
  <path d="M 120 110 Q 122 114 124 113" fill="none" class="stroke-white-thin" />
  <path d="M 160 110 Q 158 114 156 113" fill="none" class="stroke-white-thin" />
  <path d="M 134 121 Q 140 117 146 121" fill="none" class="stroke-white-thin" />
</svg>
